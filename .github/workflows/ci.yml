name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # No linter is configured for this package, so check that every module
      # compiles and that the public API imports.
      - name: Compile and import
        run: |
          python -m compileall -q agent_framework_goodmem tests
          python -c "from agent_framework_goodmem import GoodMemClient, GoodMemContextProvider, create_goodmem_tools, __version__; print(__version__)"

      # Matches a real key (the prefix plus 26 alphanumerics); written as g[m]_
      # so the literal prefix never appears in the repository's own key scans.
      - name: No committed GoodMem API keys
        run: |
          if git grep -nE '(^|[^A-Za-z0-9_])g[m]_[A-Za-z0-9]{26}([^A-Za-z0-9_]|$)' -- . ; then
            echo "::error::A GoodMem API key is committed. Remove it and rotate the key."
            exit 1
          fi

      # Offline tests replay captured server streams. The live tests in
      # tests/test_goodmem_integration.py skip because no API key is set.
      - name: Tests
        env:
          GOODMEM_API_KEY: ""
        run: python -m pytest -v
